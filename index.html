<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Kanit:wght@300;400;500&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8fa3;
            --secondary: #ffcad4;
            --bg: #fff5f7;
            --text: #7a5c61;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        #main-app-content { transition: filter 0.3s ease; }
        .modal-active #main-app-content { filter: blur(8px); }

        /* --- Login Page --- */
        #login-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .pass-dots { display: flex; gap: 15px; margin-bottom: 20px; }
        .dot { width: 15px; height: 15px; border: 2px solid var(--primary); border-radius: 50%; transition: 0.2s; }
        .dot.active { background: var(--primary); transform: scale(1.2); box-shadow: 0 0 10px var(--primary); }
        .keypad { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; }
        .key { 
            width: 80px; height: 80px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .key:active { transform: scale(0.9); background: var(--secondary); }

        /* --- Main Content --- */
        #main-app { display: none; padding-bottom: 120px; }
        section { min-height: 100vh; padding: 40px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        .calendar-wrap { display: flex; gap: 10px; margin-bottom: 10px; justify-content: center; }
        .calendar-card {
            background: white; width: 90px; height: 110px; border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #eee;
        }
        .cal-top { background: var(--primary); height: 28px; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }
        .cal-num { font-size: 1.5rem; font-weight: 600; color: var(--text); padding-top: 15px; display: block; }
        
        .clock-container {
            background: #fff; padding: 15px 25px; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.2);
            border: 4px solid var(--secondary); display: flex; gap: 10px; align-items: center; margin: 20px 0; justify-content: center;
        }
        .clock-val { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--primary); }

        /* --- Number 4 Grid (Photo 1-6) --- */
        .number-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 25vmin); 
            grid-template-rows: repeat(4, 25vmin); 
            gap: 10px; 
            justify-content: center;
            margin: 20px auto;
        }
        .img-item { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; }
        
        .n1 { grid-column: 1; grid-row: 1; }
        .n2 { grid-column: 1; grid-row: 2; }
        .n3 { grid-column: 1; grid-row: 3; }
        .n4 { grid-column: 2; grid-row: 3; }
        .n5 { grid-column: 3; grid-row: 3; }
        .n6 { grid-column: 3; grid-row: 1 / 5; }

        /* --- Envelope & Paper --- */
        .envelope-container { position: relative; height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .envelope { width: 240px; height: 150px; background: #ffc1cc; border-radius: 0 0 10px 10px; position: relative; cursor: pointer; z-index: 10; }
        .envelope::before { content: ''; position: absolute; top: -100px; left: 0; border-left: 120px solid transparent; border-right: 120px solid transparent; border-bottom: 100px solid #ff8fa3; transition: 0.5s; z-index: 12; transform-origin: bottom; }
        .envelope.open::before { transform: rotateX(180deg); z-index: 1; }
        .paper { position: absolute; top: 10px; left: 10px; width: 220px; height: 130px; background: white; transition: 0.7s; z-index: 5; padding: 20px; box-sizing: border-box; overflow-y: auto; text-align: center; }
        .envelope.open .paper { transform: translateY(-220px); height: 380px; width: 300px; left: -30px; z-index: 15; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }

        /* --- Gift Boxes & Shaking Animation --- */
        .boxes-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 35px; max-width: 300px; margin: 0 auto; }
        .gift-box { font-size: 65px; cursor: pointer; transition: 0.2s; display: inline-block; }
        
        /* แอนิเมชั่นสั่นตอนกำลังลุ้น */
        .shake-box { animation: box-rumble 0.1s infinite; }
        @keyframes box-rumble {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-2deg); }
            40% { transform: translate(-3px, 0px) rotate(3deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(2deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        /* --- Modal --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 400px; }
        .polaroid { background: white; padding: 12px 12px 50px 12px; border-radius: 2px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .polaroid img { width: 100%; max-width: 260px; height: auto; }
        
        .ticket { width: 280px; background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--primary); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        .ticket-header { background: var(--primary); color: white; padding: 10px; font-weight: 600; text-align: center; }
        .ticket-content { padding: 30px 20px; border-bottom: 2.5px dashed var(--secondary); text-align: center; }
        .ticket-prize { font-size: 1rem; font-weight: 600; color: var(--primary); }

        nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 25px; border-radius: 40px; display: flex; gap: 20px; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        nav a { text-decoration: none; font-size: 24px; }
        .btn-close { background: var(--primary); color: white; border: none; padding: 12px 35px; border-radius: 30px; margin-top: 25px; font-family: 'Prompt'; cursor: pointer; }
    </style>
</head>
<body id="body-content">

    <div id="login-page">
        <h3 style="color: var(--primary); margin-bottom: 10px;">Enter Password ♡</h3>
        <div class="pass-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
            <div class="key" onclick="addNum('1')">1</div><div class="key" onclick="addNum('2')">2</div><div class="key" onclick="addNum('3')">3</div>
            <div class="key" onclick="addNum('4')">4</div><div class="key" onclick="addNum('5')">5</div><div class="key" onclick="addNum('6')">6</div>
            <div class="key" onclick="addNum('7')">7</div><div class="key" onclick="addNum('8')">8</div><div class="key" onclick="addNum('9')">9</div>
            <div style="width:80px"></div><div class="key" onclick="addNum('0')">0</div><div class="key" onclick="clearPass()" style="font-size:14px; color:var(--primary);">ลบ</div>
        </div>
    </div>

    <div id="main-app-content">
        <div id="main-app">
            <section id="time-sec">
                <div style="color: var(--primary); margin-bottom: 20px;">เราเดินมาด้วยกันแล้ว...</div>
                <div class="calendar-wrap">
                    <div class="calendar-card"><span class="cal-top">ปี</span><span class="cal-num" id="y">0</span></div>
                    <div class="calendar-card"><span class="cal-top">เดือน</span><span class="cal-num" id="m">0</span></div>
                    <div class="calendar-card"><span class="cal-top">วัน</span><span class="cal-num" id="d">0</span></div>
                </div>
                <div class="clock-container">
                    <span class="clock-val" id="ch">00</span> : <span class="clock-val" id="cm">00</span> : <span class="clock-val" id="cs">00</span>
                </div>
            </section>

            <section id="photo-sec">
                <h2 style="color: var(--primary); margin-bottom: 30px;">Happy Anniversary</h2>
                <div class="number-grid">
                    <img src="photo1.jpg" class="img-item n1" onclick="zoomImg(this, '')">
                    <img src="photo2.jpg" class="img-item n2" onclick="zoomImg(this, '')">
                    <img src="photo3.jpg" class="img-item n3" onclick="zoomImg(this, '')">
                    <img src="photo4.jpg" class="img-item n4" onclick="zoomImg(this, '')">
                    <img src="photo5.jpg" class="img-item n5" onclick="zoomImg(this, '')">
                    <img src="photo6.jpg" class="img-item n6" onclick="zoomImg(this, '')">
                </div>
            </section>

            <section id="letter-sec">
                <div class="envelope-container">
                    <div class="envelope" id="env" onclick="openLetter()">
                        <div class="paper" id="paper">
                            <div id="typewriter" style="font-size: 0.82rem; line-height: 1.6; color: #555; white-space: pre-wrap;"></div> </div>
                    </div>
                </div>
            </section>

            <section id="fun-sec">
                <h3 style="color: var(--primary); margin-bottom: 40px;">เลือกของขวัญของคุณ! 🎁</h3>
                <div class="boxes-grid">
                    <div class="gift-box" onclick="pickBox(this, 0)">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 1)">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 2)">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 3)">🎁</div>
                    <div class="gift-box" onclick="pickBox(this, 4)">🎁</div>
                </div>
            </section>

            <nav>
                <a href="#time-sec">⏰</a>
                <a href="#photo-sec">🖼️</a>
                <a href="#letter-sec">✉️</a>
                <a href="#fun-sec">🎁</a>
            </nav>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="photo-area">
                <div class="polaroid">
                    <img id="modal-img" src="">
                    <div id="img-caption" style="text-align:center; margin-top:10px;"></div>
                </div>
            </div>
            <div id="coupon-area" style="display: none;">
                <div class="ticket">
                    <div class="ticket-header">LOVE COUPON</div>
                    <div class="ticket-content">
                        <div id="coupon-text" class="ticket-prize"></div>
                    </div>
                    <div style="font-size:0.6rem; text-align:center; padding:5px; color:#bbb;">* แคปหน้าจอเพื่อใช้สิทธิ์ *</div>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal()">ปิด ♡</button>
        </div>
    </div>

    <audio id="bgm" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <script>
        let pass = "";
        const target = "241253"; 
        const prizes = ["บัตรตามใจจพุ่พุ่1วัน", "เลี้ยงของกินพุ่พุ่2วัน", "คูปองงดบ่น1วัน", "คูปองพาไปดูหนัง1เรื่อง", "คูปองไม่งอน2วัน"];

        function addNum(n) {
            if(pass.length < 6) {
                pass += n;
                document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i < pass.length));
                if(pass.length === 6) {
                    if(pass === target) {
                        document.getElementById('login-page').style.display = 'none';
                        document.getElementById('main-app').style.display = 'block';
                        document.getElementById('bgm').play().catch(() => {});
                        startTimer();
                    } else {
                        pass = "";
                        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                    }
                }
            }
        }
        function clearPass() { pass = ""; document.querySelectorAll('.dot').forEach(d => d.classList.remove('active')); }

        function startTimer() {
            const start = new Date("2026-01-10T00:00:00"); 
            setInterval(() => {
                const now = new Date();
                let y = now.getFullYear() - start.getFullYear();
                let m = now.getMonth() - start.getMonth();
                let d = now.getDate() - start.getDate();
                if(d < 0) { m--; let prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); }
                if(m < 0) { y--; m += 12; }
                document.getElementById('y').innerText = y;
                document.getElementById('m').innerText = m;
                document.getElementById('d').innerText = d;
                document.getElementById('ch').innerText = String(now.getHours()).padStart(2,'0');
                document.getElementById('cm').innerText = String(now.getMinutes()).padStart(2,'0');
                document.getElementById('cs').innerText = String(now.getSeconds()).padStart(2,'0');
            }, 1000);
        }

        function zoomImg(el, caption) {
            document.getElementById('photo-area').style.display = 'block';
            document.getElementById('coupon-area').style.display = 'none';
            document.getElementById('modal-img').src = el.src;
            document.getElementById('img-caption').innerText = caption;
            document.getElementById('body-content').classList.add('modal-active');
            document.getElementById('modal').classList.add('active');
        }

        function openLetter() {
            document.getElementById('env').classList.add('open');
            const msg = "ถึงพุ่พุ่ \nhappy anniversary 4⃣m \nขอบคุนพุ่พุ่ที่ยังยุข้างกันเสมอ \nถึงจะทะเลาะกันบ้าง \nตีกันทุ้กกวันน \nเเต่เแก้มรักพุ่เสมอน้ะ\nขอท้ดที่ทำตัวไม่ดีดีให้พุ่พุ่\nเแก้มรักพุ่ม้ากๆ ยิ้มเย้อๆน้ะ";
            let i = 0;
            if(document.getElementById('typewriter').innerHTML === "") {
                function type() {
                    if (i < msg.length) {
                        document.getElementById('typewriter').innerHTML += msg.charAt(i) === '\n' ? '<br>' : msg.charAt(i);
                        i++; setTimeout(type, 50);
                    }
                }
                setTimeout(type, 1000);
            }
        }

        function pickBox(el, index) {
            if(el.innerText === "✨") return;
            
            // เพิ่มเอฟเฟกต์สั่นลุ้นๆ
            el.classList.add('shake-box');
            
            setTimeout(() => {
                el.classList.remove('shake-box');
                el.innerText = "✨";
                document.getElementById('photo-area').style.display = 'none';
                document.getElementById('coupon-area').style.display = 'block';
                document.getElementById('coupon-text').innerText = prizes[index];
                document.getElementById('body-content').classList.add('modal-active');
                document.getElementById('modal').classList.add('active');
            }, 1200); // สั่น 1.2 วินาทีก่อนแสดงคูปอง
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('body-content').classList.remove('modal-active');
        }
    </script>
</body>
</html>
